<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">

    <title>DVD Inventory</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #111827;
            color: #f9fafb;
        }

        main {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            margin-bottom: 12px;
        }

        p {
            color: #9ca3af;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-top: 24px;
            padding: 10px 18px;
            border: 1px solid #374151;
            border-radius: 999px;
            color: #86efac;
        }
    </style>
</head>

<body>
    <main>
        <h1>📀 DVD Inventory</h1>

        <p>
            Barcode-driven DVD inventory, tote tracking,
            checkout, and collection management.
        </p>

        <div class="status">
            ✓ Development has begun
        </div>
    </main>
</body>
</html>
